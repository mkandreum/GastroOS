services:
  client-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      APP_TYPE: client
      PORT: 3000
      APP_URL: ${SERVICE_URL_CLIENT_APP:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (32+ caracteres)}
      TABLE_TOKEN_SECRET: ${TABLE_TOKEN_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_DEMO: ${SEED_DEMO:-true}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@gastro-os.local}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  internal-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      APP_TYPE: internal
      PORT: 3000
      APP_URL: ${SERVICE_URL_INTERNAL_APP:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (32+ caracteres)}
      TABLE_TOKEN_SECRET: ${TABLE_TOKEN_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_DEMO: ${SEED_DEMO:-true}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@gastro-os.local}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
    driver: local
